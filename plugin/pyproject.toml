[project]
name = "director-deck"
description = "长视频导演台，面向 MiniMax H3。一键启动 WebUI 在 timeline 上创作！"
version = "0.2.7"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.6,<4.10",
    "fastapi>=0.116,<0.117",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
    "websockets>=16,<18",
]

[project.urls]
Repository = "https://github.com/JYE-HC/DirectorDeck"

[tool.comfy]
PublisherId = "jye-hc"
DisplayName = "DirectorDeck"
Icon = "https://raw.githubusercontent.com/JYE-HC/DirectorDeck/main/icon.png"
Banner = "https://raw.githubusercontent.com/JYE-HC/DirectorDeck/main/banner.png"
