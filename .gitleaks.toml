title = "Director Web release secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Exact synthetic test credentials and deterministic workflow identifiers"
condition = "AND"
regexTarget = "line"
paths = [
  '''^backend/tests/test_job_management\.py$''',
  '''^backend/tests/fixtures/extensible_workflow_v0/(?:current_v4_expected|native_prompt_goldens)\.json$''',
  '''^\.gitleaks\.toml$''',
]
regexes = [
  '''token=private-token Authorization: Bearer private-bearer request to''',
  '''https://alice:private-password@comfy\.test failed''',
  '''access_token=private-access refreshToken=private-refresh''',
  '''client_secret=private-client-secret apiKey=private-api-key''',
  '''Bearer private-json-bearer''',
  '''Basic private-quoted-basic''',
  '''password = \\"private password with spaces\\"''',
  '''"compatibility_key": "director-g[0-9a-z-]+"''',
  '''"runtime_key": "[0-9a-f]{64}"''',
]
